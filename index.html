<!DOCTYPE html>
<html lang="fr" data-theme="aurora">
<head>
  <script>window.__CDN__ = true; /* images du catalogue : free-exercise-db (GitHub) */</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F8F9">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stride Me">
  <title>Stride Me – Fitness Log</title>
  <meta name="description" content="Application de suivi de musculation premium.">

  <!-- Applique les réglages enregistrés avant le premier rendu (évite le flash) -->
  <script>
    try {
      var h = document.documentElement, s = JSON.parse(localStorage.getItem('settings') || 'null') || {};
      var t = s.theme || localStorage.getItem('theme');
      if (['aurora', 'pro', 'classic', 'dark', 'gym'].indexOf(t) !== -1) h.setAttribute('data-theme', t);
      if (['lexend', 'atkinson', 'dyslexic'].indexOf(s.font) !== -1) h.setAttribute('data-font', s.font);
      if (['wide', 'xwide'].indexOf(s.spacing) !== -1) h.setAttribute('data-spacing', s.spacing);
      if (s.contrast === true) h.setAttribute('data-contrast', 'high');
      if (!t) h.setAttribute('data-theme', 'aurora');
      if (s.splash === false) h.setAttribute('data-splash', 'off');
      if (s.motion === true) h.setAttribute('data-motion', 'off');
      var z = Number(s.size);
      if (z >= 85 && z <= 140) h.style.setProperty('--fs', String(z / 100));
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gym.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/aurora.css">
  <link rel="stylesheet" href="css/pro.css">
  <link rel="stylesheet" href="css/timer.css">
</head>
<body>

  <!-- Sprite SVG (style Lucide, inline) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></symbol>
  </svg>

  <div id="splash" aria-hidden="true">
    <div class="splash-in">
      <div class="splash-art"></div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <div id="app-shell">
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Stride Me — accueil">
        <img class="brand-mark" src="assets/mark.webp" alt="" width="36" height="31">
        <img class="brand-title" src="assets/title.webp" alt="Stride Me" width="104" height="27">
      </a>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#/" class="tab" data-route="/"><svg class="icon"><use href="#i-home"/></svg><span>Accueil</span></a>
      <a href="#/planning" class="tab" data-route="/planning"><svg class="icon"><use href="#i-calendar"/></svg><span>Planning</span></a>
      <a href="#/exercises" class="tab" data-route="/exercises"><svg class="icon"><use href="#i-dumbbell"/></svg><span>Exercices</span></a>
      <a href="#/stats" class="tab" data-route="/stats"><svg class="icon"><use href="#i-chart"/></svg><span>Historique</span></a>
      <a href="#/profile" class="tab" data-route="/profile"><svg class="icon"><use href="#i-user"/></svg><span>Profil</span></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Permet l'installation sur l'écran d'accueil (Android) avec l'icône Stride Me
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
